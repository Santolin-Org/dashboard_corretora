name: web-regressao

on:
  push:
    paths: ['web/**', '.github/workflows/web-regressao.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-regressao.yml']

defaults:
  run:
    working-directory: web

env:
  TZ: America/Sao_Paulo

jobs:
  regressao:
    runs-on: ubuntu-latest
    # Imagem oficial do Playwright (mesma versão do package-lock): navegador e fontes já instalados, sem depender
    # do apt do Ubuntu — em 11/11/2026 o runner passou horas sem resolver archive.ubuntu.com e a regressão nem rodava.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run regressao
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-paridade
          path: web/parity/.golden/relatorio.md
          if-no-files-found: ignore
